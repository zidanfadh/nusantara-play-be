# Rate limiting zone
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# Upstream backend service
upstream nusantara_backend {
    server localhost:3000;
    keepalive 64;
}

# =====================================================================
# HTTPS Server (Primary - SSL configured by Certbot)
# =====================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    http2 on;
    server_name api-nusantaraplay.kpoti.id;

    # SSL certificate paths (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/api-nusantaraplay.kpoti.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-nusantaraplay.kpoti.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Hide nginx version
    server_tokens off;

    # Client body size limit
    client_max_body_size 50M;
    client_body_timeout 60s;

    # Logging
    access_log /var/log/nginx/nusantara-access.log;
    error_log /var/log/nginx/nusantara-error.log;

    # API endpoint
    location / {
        # Rate limiting
        limit_req zone=api_limit burst=20 nodelay;

        # Proxy headers
        proxy_pass http://nusantara_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;

        proxy_set_header X-Forwarded-Host $server_name;
    }

    # Health check endpoint
    location /api/health {
        proxy_pass http://nusantara_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}

# =====================================================================
# HTTP Server (Redirect to HTTPS)
# =====================================================================
server {
    listen 80;
    listen [::]:80;
    server_name api-nusantaraplay.kpoti.id;

    # Allow Let's Encrypt certbot challenges (for renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}