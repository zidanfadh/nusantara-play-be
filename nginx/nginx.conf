# Rate limiting zone
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# Upstream backend service
upstream nusantara_backend {
    server localhost:3000;
    keepalive 64;
}

# =====================================================================
# STEP 1: HTTP Server (Aktif untuk initial setup & certbot)
# Setelah mendapat SSL certificate, uncomment redirect di bawah
# =====================================================================
server {
    listen 80;
    listen [::]:80;
    server_name api-nusantaraplay.kpoti.id;  # Ganti dengan domain Anda

    # Allow Let's Encrypt certbot challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # UNCOMMENT baris berikut setelah SSL certificate berhasil dibuat:
    # location / {
    #     return 301 https://$server_name$request_uri;
    # }

    # TEMPORARY: Proxy ke backend (HAPUS/COMMENT setelah SSL aktif)
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Hide nginx version
    server_tokens off;

    # Client body size limit
    client_max_body_size 50M;
    client_body_timeout 60s;

    # Logging
    access_log /var/log/nginx/nusantara-access.log;
    error_log /var/log/nginx/nusantara-error.log;

    # API endpoint (temporary, akan pindah ke HTTPS)
    location / {
        # Rate limiting
        limit_req zone=api_limit burst=20 nodelay;

        # Proxy headers
        proxy_pass http://nusantara_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;

        proxy_set_header X-Forwarded-Host $server_name;
    }

    # Health check endpoint
    location /api/health {
        proxy_pass http://nusantara_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}

