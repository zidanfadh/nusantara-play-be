# Local development database ONLY (Phase 05).
# Start with `npm run db:up`. Never use this file on a server.
#
# The password "localdev" is a fixed, publicly known, local-only value.
# It must NEVER be used for any other database or environment.
name: nusantara-dev

services:
  postgres:
    # Pinned to the major version in README.md (PostgreSQL 15) until the
    # production version is known.
    image: postgres:15-alpine
    container_name: nusantara-dev-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localdev # local-only, never reuse anywhere else
      POSTGRES_DB: postgres
    ports:
      # Bound to loopback only: not reachable from other machines.
      - '127.0.0.1:5432:5432'
    volumes:
      - nusantara-dev-db-data:/var/lib/postgresql/data
      # Runs once, on the first start with an empty volume.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d nusantara_play_dev']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  nusantara-dev-db-data:
    name: nusantara-dev-db-data
